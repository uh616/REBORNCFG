name: REBORN CFG - Update Configs

on:
  schedule:
    # Запуск каждый час (24 раза в сутки)
    - cron: '0 * * * *'
  workflow_dispatch:  # Ручной запуск из GitHub Actions

concurrency:
  group: "update-configs"
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 1
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r source/requirements.txt
      timeout-minutes: 5

    - name: Install Xray and Sing-box cores for real verification
      run: |
        curl -sL https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o xray.zip
        sudo unzip -q -o xray.zip xray -d /usr/local/bin
        sudo chmod +x /usr/local/bin/xray
        curl -sL https://github.com/SagerNet/sing-box/releases/download/v1.11.4/sing-box-1.11.4-linux-amd64.tar.gz | sudo tar -xz --strip-components=1 -C /usr/local/bin/ sing-box-1.11.4-linux-amd64/sing-box
        sudo chmod +x /usr/local/bin/sing-box
        xray version
        sing-box version
      timeout-minutes: 5
        
    - name: Run Config Collector
      env:
        GITHUB_REPO_NAME: ${{ github.repository }}
        GITHUB_BRANCH: main
      run: |
        python source/config_collector.py
      timeout-minutes: 30
      
    - name: Commit and push changes
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        
        # Добавляем все обновленные файлы подписок и README
        git add -A hysteria2/ vless/ vmess/ shadowsocks/ trojan/ README.md
        
        # Проверяем наличие изменений перед коммитом
        if ! git diff --staged --quiet; then
          git commit -m "⚡ Auto update: $(date -u +'%Y-%m-%d %H:%M:%S UTC') [skip ci]"
          git push origin main
          echo "✅ Успешно обновлено и отправлено в репозиторий"
        else
          echo "ℹ️ Изменений нет, репозиторий уже содержит самые свежие данные"
        fi
